<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.ico">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232563eb'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-size='55'%3E⌨%3C/text%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - TypeMaster</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .reset-box {
      background: white;
      width: 400px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    h2 {
      margin-top: 0;
      color: #111827;
    }

    p {
      color: #6b7280;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 10px 0;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

    .password-input-wrapper {
      position: relative;
      width: 100%;
    }

    .password-input-wrapper input {
      width: 100%;
      padding-right: 45px;
      box-sizing: border-box;
    }

    .password-input-wrapper button {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 4px;
      font-size: 18px;
      z-index: 10;
      width: auto;
      margin: 0;
      color: #111827;
    }
  </style>
</head>

<body>

  <div class="reset-box">
    <h2>Reset Your Password</h2>

    <p>Enter your new TypeMaster password.</p>

    <div class="password-input-wrapper">
      <input id="newPassword" type="password" placeholder="New password" minlength="6">
      <button type="button" id="toggleNewPassword">👁️</button>
    </div>

    <div class="password-input-wrapper">
      <input id="confirmPassword" type="password" placeholder="Confirm new password" minlength="6">
      <button type="button" id="toggleConfirmPassword">👁️</button>
    </div>

    <button id="resetButton">
      Reset Password
    </button>

    <div id="message"></div>
  </div>

  <script>
    const resetButton = document.getElementById("resetButton");
    const message = document.getElementById("message");

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    resetButton.addEventListener("click", async () => {

      const newPassword =
        document.getElementById("newPassword").value.trim();

      const confirmPassword =
        document.getElementById("confirmPassword").value.trim();

      if (!token) {
        message.textContent = "Invalid reset link.";
        return;
      }

      if (newPassword.length < 6) {
        message.textContent =
          "Password must be at least 6 characters.";
        return;
      }

      if (newPassword !== confirmPassword) {
        message.textContent =
          "Passwords do not match.";
        return;
      }

      try {

        const response = await fetch(
          "https://typemaster-backend-01.onrender.com/api/auth/reset-password",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              token: token,
              newPassword: newPassword
            })
          }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.message || "Could not reset password."
          );
        }

        message.innerHTML =
          'Password reset successfully! <button id="goToSignIn" type="button">Sign In</button>';
        document.getElementById("goToSignIn").addEventListener("click", () => {
          localStorage.setItem("typemaster-open-signin", "true");
          window.location.href = "profile.html";
        });

        resetButton.disabled = true;

      } catch (error) {

        console.error("Reset password error:", error);

        message.textContent =
          error.message || "Could not reset password.";
      }

    });
    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    document.getElementById("toggleNewPassword").addEventListener("click", () => {
      newPasswordInput.type =
        newPasswordInput.type === "password" ? "text" : "password";
    });

    document.getElementById("toggleConfirmPassword").addEventListener("click", () => {
      confirmPasswordInput.type =
        confirmPasswordInput.type === "password" ? "text" : "password";
    });
  </script>

</body>

</html>
